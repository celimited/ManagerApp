        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SrStatListData'

    SrProfile:
      type: object
      required:
        - srId
        - name
        - isOnline
      properties:
        srId:
          type: integer
          example: 5012
        name:
          type: string
          example: "Robert Jenkins"
        designation:
          type: string
          example: "Senior Sales Representative"
        photoUrl:
          type: string
          nullable: true
          example: "https://cdn.example.com/sr/5012.jpg"
        phoneNo:
          type: string
          example: "+8801712345678"
        whatsAppUrl:
          type: string
          nullable: true
          example: "https://wa.me/8801712345678"
        locationName:
          type: string
          example: "Mowlovi Bazar SLD"
        territoryName:
          type: string
          example: "Mowlovi Bazar Territory"
        isOnline:
          type: boolean
          example: true

    SrWorkTimeline:
      type: object
      properties:
        loggedInAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-05T08:45:00"
        workMode:
          type: string
          enum: [ ON_FIELD, OFFICE, OTHER ]
          example: "ON_FIELD"
        spentMinutes:
          type: integer
          description: Time spent working so far today
          example: 90
        hasVisited:
          type: boolean
          example: true
        firstOrderAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-05T11:45:00"
        firstOrderOutlet:
          type: string
          nullable: true
          example: "Fresh mart"
        lastOrderAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-05T14:45:00"
        lastOrderOutlet:
          type: string
          nullable: true
          example: "Fresh mart"

    SrWorkCounts:
      type: object
      required:
        - scheduled
        - visited
        - productive
        - lpc
      properties:
        scheduled:
          type: integer
          example: 20
        visited:
          type: integer
          example: 16
        productive:
          type: integer
          example: 12
        lpc:
          type: number
          example: 1.24

    SrTarget:
      type: object
      required:
        - todayTarget
        - orderValue
        - achievementPercent
      properties:
        todayTarget:
          type: number
          example: 20000
        orderValue:
          type: number
          example: 16000
        achievementPercent:
          type: number
          example: 16

    SrDetailData:
      type: object
      required:
        - profile
        - timeline
        - work
        - target
      properties:
        profile:
          $ref: '#/components/schemas/SrProfile'
        timeline:
          $ref: '#/components/schemas/SrWorkTimeline'
        work:
          $ref: '#/components/schemas/SrWorkCounts'
        target:
          $ref: '#/components/schemas/SrTarget'

    SrDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SrDetailData'

    SrOrderItem:
      type: object
      required:
        - id
        - name
        - qty
        - memoCount
      properties:
        id:
          type: integer
          example: 8801
        name:
          type: string
          example: "Starship"
        subName:
          type: string
          description: Second line, e.g. the SKU under a product
          example: "Starship FCMP 10 gm"
        qty:
          type: number
          example: 24
        memoCount:
          type: integer
          example: 4
        specialDiscount:
          type: number
          example: 0
        promoDiscount:
          type: number
          example: 0
        totalDiscount:
          type: number
          example: 0
        freeValue:
          type: number
          example: 0
        orderQtyUom:
          type: number
          description: Ordered quantity in UOM
          example: 0.73
        freeQty:
          type: number
          example: 0

    SrOrderListData:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SrOrderItem'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalCount:
          type: integer
          example: 2

    SrOrderListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SrOrderListData'