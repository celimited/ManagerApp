openapi: 3.0.0
info:
  title: Manager App API Documentation
  version: 1.0.0

servers:
  - url: http://210.4.65.222/SupervisorApp/api/v1
    description: Test server

paths:
  /auth/login:
    post:
      summary: User Login
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/forgot-password:
    post:
      summary: Request Password Reset OTP
      operationId: forgotPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIdRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'

  /auth/verify-otp:
    post:
      summary: Verify Password Reset OTP
      operationId: verifyOtp
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'

  /auth/resend-otp:
    post:
      summary: Resend Password Reset OTP
      operationId: resendOtp
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIdRequest'
      responses:
        '200':
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'

  /auth/reset-password:
    post:
      summary: Reset Password
      operationId: resetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'

  /user/subordinate-hierarchy-levels:
    get:
      summary: Get Subordinate Hierarchy Levels for Tabs
      operationId: getSubordinateHierarchyLevels
      tags:
        - Hierarchy
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Hierarchy tabs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyLevelsResponse'

  /user/team-members:
    get:
      summary: Get Team Members (Add Issue → Assign To)
      description: >
        The logged-in user's team members who cover the given distributor — the people an issue
        for that distributor can be assigned to. Sorted by name.
      operationId: getTeamMembers
      tags:
        - Hierarchy
      security:
        - BearerAuth: [ ]
      parameters:
        - name: distributorId
          in: query
          required: true
          description: Distributor id (the `id` from /user/distributors)
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: Team members retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/DistributorNotFoundError'

  /attendance/monthly-summary:
    get:
      summary: Get Monthly Attendance Summary and Calendar Data
      operationId: getMonthlyAttendanceSummary
      tags:
        - Attendance
      security:
        - BearerAuth: [ ]
      parameters:
        - name: userId
          in: query
          required: true
          description: Unique identifier of the user
          schema:
            type: string
          example: "usr_7f3a92bc"
        - name: month
          in: query
          required: true
          description: Target month (1-12)
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 1
        - name: year
          in: query
          required: true
          description: Target year
          schema:
            type: integer
          example: 2026
      responses:
        '200':
          description: Monthly attendance report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyAttendanceResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /attendance/team-summary:
    get:
      summary: Get Team Attendance Summary & Manager List By Level
      operationId: getTeamAttendanceSummary
      tags:
        - Attendance
      security:
        - BearerAuth: [ ]
      parameters:
        - name: levelKey
          in: query
          required: true
          description: Target level key selected from hierarchy tabs (e.g., DIVISION, REGION, AREA, TERRITORY)
          schema:
            type: string
          example: "DIVISION"
        - name: searchQuery
          in: query
          required: false
          description: Filter by name, location, or designation
          schema:
            type: string
          example: "Sarah"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          example: 20
      responses:
        '200':
          description: Team attendance report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAttendanceSummaryResponse'

  /attendance/save-attendance:
    post:
      summary: Save Attendance Check-in
      operationId: saveAttendance
      tags:
        - Attendance
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAttendanceRequest'
      responses:
        '200':
          description: Attendance saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveAttendanceResponse'

  /attendance/today-status:
    get:
      summary: Get Today's Attendance Status for the Home Popup
      description: >
        Returns the user's attendance state for today together with the on-time deadline and the
        server clock. The app rejects check-in when the device clock differs from `serverTime` by
        more than 2 minutes; otherwise it compares the device time with `attendanceDeadline` to
        decide whether to show the on-time or late check-in popup. The server still validates
        late/on-time when `/attendance/save-attendance` is called.
        Called once right after login (together with late-reasons, geofence-config and
        distributors) and cached for the session.
      operationId: getTodayAttendanceStatus
      tags:
        - Attendance
      security:
        - BearerAuth: [ ]
      parameters:
        - name: userId
          in: query
          required: true
          description: Unique identifier of the user
          schema:
            type: string
          example: "usr_7f3a92bc"
      responses:
        '200':
          description: Today's attendance status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayAttendanceStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /attendance/late-reasons:
    get:
      summary: Get Late Attendance Reason List
      description: >
        Reason options shown in the late check-in popup. Static reference data — the app fetches it
        once per session and caches it.
      operationId: getLateReasons
      tags:
        - Attendance
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Late reason list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LateReasonListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /attendance/leave-reasons:
    get:
      summary: Get Leave Reason List
      description: >
        Reason options shown when applying for leave. Static reference data — the app fetches it
        once per session and caches it.
      operationId: getLeaveReasons
      tags:
        - Attendance
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Leave reason list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveReasonListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /attendance/apply-leave:
    post:
      summary: Apply for Leave
      operationId: applyLeave
      tags:
        - Attendance
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyLeaveRequest'
      responses:
        '200':
          description: Leave request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyLeaveResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /user/geofence-config:
    get:
      summary: Get Geofence Configuration
      description: >
        Per-salespoint enforcement rule and allowed radius. When the selected distributor's id
        matches a `salespointId`, its coordinates are valid and `defaultRadiusMeters` > 0, the app
        measures the device's distance to the distributor and applies `checkInOption` if it is
        outside the radius. Fetched once per session and cached.
      operationId: getGeofenceConfig
      tags:
        - Geofence
      security:
        - BearerAuth: [ ]
      parameters:
        - name: userId
          in: query
          required: true
          description: Unique identifier of the user
          schema:
            type: string
          example: "usr_7f3a92bc"
      responses:
        '200':
          description: Geofence configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeofenceConfigResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /AIReportGenerator/AskOpenAI:
    post:
      summary: Ask AI for a Sales Report
      operationId: askOpenAI
      tags:
        - AI Sales Report
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskOpenAiRequest'
      responses:
        '200':
          description: AI-generated report data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskOpenAiResponse'

  /AIReportGenerator/AskOpenAIForSummary:
    post:
      summary: Summarise a report the AI already produced
      operationId: askOpenAIForSummary
      description: >
        Sends a result from /AIReportGenerator/AskOpenAI back to the model for
        interpretation. `QueryLogID` is the id that AskOpenAI returned for the query,
        and `Data` is that query's rows keyed by column name.
      tags:
        - AI Sales Report
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskOpenAiSummaryRequest'
      responses:
        '200':
          description: Summary generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskOpenAiSummaryResponse'

  /AIReportGenerator/GetAIFAQs:
    get:
      summary: Get suggested FAQ prompts for a user
      operationId: getAIFAQs
      description: >
        Curated starter questions shown on the AI Sales Report screen while no query
        result is displayed. Each item carries a `queryLogID` that is passed back to
        /AIReportGenerator/AskOpenAI when the user taps it.
      tags:
        - AI Sales Report
      security:
        - BearerAuth: [ ]
      parameters:
        - name: UserID
          in: query
          required: true
          description: Unique identifier of the user
          schema:
            type: string
          example: "1768"
      responses:
        '200':
          description: FAQ list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLogListResponse'

  /AIReportGenerator/GetCurrentUserAllQueryLog:
    get:
      summary: Get a user's previously executed prompts
      operationId: getCurrentUserAllQueryLog
      description: >
        History of prompts this user has already run, shown in the "Previous prompts"
        sheet. Selecting one re-runs it through /AIReportGenerator/AskOpenAI with its
        `queryLogID`.
      tags:
        - AI Sales Report
      security:
        - BearerAuth: [ ]
      parameters:
        - name: UserID
          in: query
          required: true
          description: Unique identifier of the user
          schema:
            type: string
          example: "1768"
      responses:
        '200':
          description: Query log retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLogListResponse'

  /user/distributors:
    get:
      summary: Get Distributors for the Logged-in User
      description: >
        Shown as the Location dropdown in the check-in popup. latitude/longitude may be empty
        strings, in which case no geofence check is done for that distributor.
      operationId: getDistributors
      tags:
        - Distributor
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Distributor list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorListResponse'

  # --- DISTRIBUTOR DETAILS (one endpoint per tab, loaded when the tab opens) ---
  # Name, code and address are NOT repeated here; the app already has them from /user/distributors.
  # Amounts are raw numbers in BDT, percents are plain numbers (78.5 = 78.5%), dates are yyyy-MM-dd.
  # The app does all display formatting (e.g. 3909000 -> "৳39.09L").
  /distributor/overview:
    get:
      summary: Get Distributor Overview (Overview tab + header)
      description: >
        Header extras (last visit, phone) plus everything on the Overview tab: growth analytics,
        target achievement, invoice status and the stock status block.
      operationId: getDistributorOverview
      tags:
        - Distributor
      security:
        - BearerAuth: [ ]
      parameters:
        - name: distributorId
          in: query
          required: true
          description: Distributor id (the `id` from /user/distributors)
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: Distributor overview retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/DistributorNotFoundError'

  /distibutor/stock-summary:
    get:
      summary: Get Distributor Stock Summary (Stock tab)
      description: >
        Pending indent approvals, indent suggestion, the six summary tiles and the stock health
        distribution for one distributor.
      operationId: getDistributorStockSummary
      tags:
        - Distributor
      security:
        - BearerAuth: [ ]
      parameters:
        - name: DistributorId
          in: query
          required: true
          description: Distributor id (the `id` from /user/distributors)
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: Distributor stock summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorStockSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/DistributorNotFoundError'

  /distributor/issues:
    get:
      summary: Get Distributor Issues (Issues tab)
      description: >
        Paged issue list for one distributor. Search and filters are applied on the server so the
        app never has to load every issue.
      operationId: getDistributorIssues
      tags:
        - Distributor
      security:
        - BearerAuth: [ ]
      parameters:
        - name: distributorId
          in: query
          required: true
          description: Distributor id (the `id` from /user/distributors)
          schema:
            type: integer
          example: 101
        - name: status
          in: query
          required: false
          description: Filter by status. Omit for all statuses.
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: priority
          in: query
          required: false
          description: Filter by priority. Omit for all priorities.
          schema:
            $ref: '#/components/schemas/IssuePriority'
        - name: search
          in: query
          required: false
          description: Case-insensitive match on title and assignee
          schema:
            type: string
          example: "invoice"
        - name: page
          in: query
          required: false
          description: 1-based page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Distributor issues retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributorIssueListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/DistributorNotFoundError'

  /distributor/save-issue:
    post:
      summary: Save Distributor Issue (Add Issue)
      description: >
        Creates a new issue for a distributor. New issues start with status PENDING. Like
        save-attendance and apply-leave, the request carries the device location and device info.
      operationId: saveDistributorIssue
      tags:
        - Distributor
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveIssueRequest'
      responses:
        '200':
          description: Issue saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/DistributorNotFoundError'

  # --- TODAY'S STATS ---
  # Scope comes from the bearer token: the backend resolves the logged-in user's subtree, so none of
  # web's ParentID / userid / MHNodes are sent. Mapping to web (v1/newDashboard/*):
  #   levelKey -> MHLevel, unitId -> a single MHNodes value, date -> DashboardDate.
  # Without levelKey a section endpoint returns only `total` (My Summary tab); with levelKey it also
  # returns `units`, one row per unit at that level (My Team tab).
  # Money is raw taka, percentages are 0-100, times are ISO-8601 local date-times — the app formats them.

  /today-stats/attendance:
    get:
      summary: Today's Stats - Attendance
      description: >
        Replaces web `getOrderAttendance` (NewAttendance): TotalSr, PresentSr, AbsentSr, LeaveSr,
        VisitSRCount, OrderStartSRCount, IdleSRCount, LastActiveSR.
      operationId: getTodayStatsAttendance
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsLevelKey'
        - $ref: '#/components/parameters/TodayStatsUnitId'
        - $ref: '#/components/parameters/TodayStatsDate'
      responses:
        '200':
          description: Attendance stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayAttendanceResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /today-stats/productivity:
    get:
      summary: Today's Stats - Call, SKU & Memo Productivity
      description: >
        Replaces web `getOrderCallProductivity` (NewCallProductivity, NewSkuProductivity, NewKeyMetrics).
        Feeds the Call Productivity, SKU Productivity and Key Sales Metrics cards (My Summary) and the
        Call & SKU Productivity card (My Team). `memo` is only filled on `total`.
      operationId: getTodayStatsProductivity
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsLevelKey'
        - $ref: '#/components/parameters/TodayStatsUnitId'
        - $ref: '#/components/parameters/TodayStatsDate'
      responses:
        '200':
          description: Productivity stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayProductivityResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /today-stats/target:
    get:
      summary: Today's Stats - Target & Achievement
      description: >
        Replaces web `getOrderTargetAchievement` (NewTargetAchievement, NewTotalTargetAchievement).
        `monthToDate` drives the header ring card ("Day 21 of 30") and the Running Track card;
        `today` / `tillDate` drive the Today and Till date cards and the My Team Target table.
        `monthToDate` is only filled on `total`.
      operationId: getTodayStatsTarget
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsLevelKey'
        - $ref: '#/components/parameters/TodayStatsUnitId'
        - $ref: '#/components/parameters/TodayStatsDate'
      responses:
        '200':
          description: Target stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayTargetResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /today-stats/inventory:
    get:
      summary: Today's Stats - Inventory Status
      description: Replaces web `getOrderInventory` (NewInventory).
      operationId: getTodayStatsInventory
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsLevelKey'
        - $ref: '#/components/parameters/TodayStatsUnitId'
        - $ref: '#/components/parameters/TodayStatsDate'
      responses:
        '200':
          description: Inventory stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayInventoryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /today-stats/zero-sales:
    get:
      summary: Today's Stats - Zero Sales Outlets & SKUs
      description: >
        Replaces web `getOrderZeroSales` (ZeroSalesInfo: ActiveOutlet, ZeroSalesOutlet, ActiveSku,
        ZeroSalesSku). The My Team "Zero sales SKU" card joins these rows with /today-stats/inventory
        rows by `unitId` for current stock.
      operationId: getTodayStatsZeroSales
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsLevelKey'
        - $ref: '#/components/parameters/TodayStatsUnitId'
        - $ref: '#/components/parameters/TodayStatsDate'
      responses:
        '200':
          description: Zero sales stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayZeroSalesResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /today-stats/order-breakdown:
    get:
      summary: Today's Stats - Order Breakdown (Project / Product / SKU)
      description: >
        Inspired by web `OrderDetails` (NewOrder). Feeds the Project / Product / SKU / SKU-wise list
        on My Summary and "Product wise order status" on My Team (Type = groupBy, Division = unitId).
      operationId: getTodayStatsOrderBreakdown
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsGroupBy'
        - $ref: '#/components/parameters/TodayStatsLevelKey'
        - $ref: '#/components/parameters/TodayStatsUnitId'
        - $ref: '#/components/parameters/TodayStatsDate'
        - $ref: '#/components/parameters/TodayStatsSearch'
        - $ref: '#/components/parameters/TodayStatsPage'
        - $ref: '#/components/parameters/TodayStatsPageSize'
      responses:
        '200':
          description: Order breakdown retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBreakdownResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /today-stats/srs:
    get:
      summary: Today's Stats - SR List
      description: >
        SR tab. Inspired by web NewDashboardOrderkpi (SRID, Name, StrikeRate, LPSC, ...). Without
        levelKey / unitId it lists every SR under the logged-in user.
      operationId: getTodayStatsSrList
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsLevelKey'
        - $ref: '#/components/parameters/TodayStatsUnitId'
        - $ref: '#/components/parameters/TodayStatsDate'
        - $ref: '#/components/parameters/TodayStatsSearch'
        - $ref: '#/components/parameters/TodayStatsPage'
        - $ref: '#/components/parameters/TodayStatsPageSize'
      responses:
        '200':
          description: SR list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SrStatListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /today-stats/sr-detail:
    get:
      summary: Today's Stats - SR Detail
      description: Profile, work timeline, work counts and today's target for one SR.
      operationId: getTodayStatsSrDetail
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsSrId'
        - $ref: '#/components/parameters/TodayStatsDate'
      responses:
        '200':
          description: SR detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SrDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/SrNotFoundError'

  /today-stats/sr-orders:
    get:
      summary: Today's Stats - SR Order Details
      description: Order lines for one SR, grouped by Project / Product / SKU / SKU-wise.
      operationId: getTodayStatsSrOrders
      tags:
        - Today Stats
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TodayStatsSrId'
        - $ref: '#/components/parameters/TodayStatsGroupBy'
        - $ref: '#/components/parameters/TodayStatsDate'
        - $ref: '#/components/parameters/TodayStatsSearch'
        - $ref: '#/components/parameters/TodayStatsPage'
        - $ref: '#/components/parameters/TodayStatsPageSize'
      responses:
        '200':
          description: SR orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SrOrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/SrNotFoundError'

components:
  securitySchemes:
    # In docs/index.html this is filled automatically from the /auth/login response.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequestError:
      description: Invalid query parameters supplied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DistributorNotFoundError:
      description: No distributor with this id is assigned to the logged-in user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            statusCode: 404
            message: "Distributor not found."
    SrNotFoundError:
      description: No SR with this id is under the logged-in user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            statusCode: 404
            message: "SR not found."

  parameters:
    TodayStatsLevelKey:
      name: levelKey
      in: query
      required: false
      description: >
        Hierarchy level from /user/subordinate-hierarchy-levels (web MHLevel). Omit for the logged-in
        user's own totals (My Summary); send it to also get one row per unit at that level (My Team).
      schema:
        type: string
      example: "REGION"
    TodayStatsUnitId:
      name: unitId
      in: query
      required: false
      description: Narrow to one unit (a `unitId` from a previous `units` row; web MHNodes).
      schema:
        type: integer
      example: 12
    TodayStatsDate:
      name: date
      in: query
      required: false
      description: Dashboard date (web DashboardDate). Defaults to today.
      schema:
        type: string
        format: date
      example: "2026-10-05"
    TodayStatsGroupBy:
      name: groupBy
      in: query
      required: true
      schema:
        type: string
        enum: [ PROJECT, PRODUCT, SKU, SKU_WISE ]
      example: "SKU_WISE"
    TodayStatsSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive name filter
      schema:
        type: string
      example: "Starship"
    TodayStatsPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
      example: 1
    TodayStatsPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 20
      example: 20
    TodayStatsSrId:
      name: srId
      in: query
      required: true
      description: SR id (the `srId` from /today-stats/srs)
      schema:
        type: integer
      example: 5012

  schemas:
    # --- BASE RESPONSES ---
    BaseApiResponse:
      type: object
      required:
        - success
        - statusCode
        - message
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Operation completed successfully."

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 401
        message:
          type: string
          example: "Invalid credentials provided."

    # --- MODELS ---
    DeviceInfo:
      type: object
      required:
        - deviceId
        - deviceType
        - os
        - appVersion
      properties:
        deviceId:
          type: string
          format: uuid
          example: "d1f2a3b4-uuid"
        deviceType:
          type: string
          example: "mobile"
        os:
          type: string
          example: "Android 14"
        appVersion:
          type: string
          example: "2.1.0"

    User:
      type: object
      required:
        - userId
        - fullName
        - email
        - phone
        - profilePictureUrl
        - role
        - status
      properties:
        userId:
          type: string
          example: "usr_7f3a92bc"
        fullName:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "user@example.com"
        phone:
          type: string
          example: "+8801700000000"
        profilePictureUrl:
          type: string
          format: uri
          example: "https://cdn.example.com/avatars/usr_7f3a92bc.jpg"
        role:
          type: string
          example: "user"
        status:
          type: string
          example: "active"

    Tokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshTokenExpiresIn
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
        tokenType:
          type: string
          nullable: true
          example: "Bearer"
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 3600
        refreshTokenExpiresIn:
          type: integer
          description: Refresh token expiration time in seconds
          example: 2592000

    OtpMetaData:
      type: object
      properties:
        expiresIn:
          type: integer
          description: OTP lifetime in seconds
          example: 300
        resendAvailableIn:
          type: integer
          description: Delay in seconds before resending is permitted
          example: 60

    # --- REQUEST PAYLOADS ---
    LoginRequest:
      type: object
      required:
        - loginId
        - password
        - deviceInfo
      properties:
        loginId:
          type: string
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "P@ssw0rd!"
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'

    LoginIdRequest:
      type: object
      required:
        - loginId
      properties:
        loginId:
          type: string
          example: "user@example.com"

    VerifyOtpRequest:
      type: object
      required:
        - otpCode
      properties:
        otpCode:
          type: string
          example: "847291"

    ResetPasswordRequest:
      type: object
      required:
        - newPassword
        - confirmPassword
      properties:
        newPassword:
          type: string
          format: password
          example: "NewP@ssw0rd!"
        confirmPassword:
          type: string
          format: password
          example: "NewP@ssw0rd!"

    # --- SPECIFIC RESPONSE ENVELOPES ---
    LoginSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Login successful."
            data:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
                tokens:
                  $ref: '#/components/schemas/Tokens'

    OtpSentResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "OTP has been sent successfully."
            data:
              $ref: '#/components/schemas/OtpMetaData'

    ResetPasswordResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Your password has been reset successfully. Please log in with your new password."

    # --- HIERARCHY SCHEMAS ---
    HierarchyLevelItem:
      type: object
      required:
        - levelKey
        - levelName
        - presentCount
        - totalCount
      properties:
        levelKey:
          type: string
          description: >
            Identifier string used as request parameter for filtering. Also drives the Today's Stats
            My Team chips, which render whatever levels are returned — the design shows National and SR
            chips too, so adding NATIONAL / SR here is an open backend decision.
          enum: [ DIVISION, REGION, AREA, TERRITORY ]
          example: "DIVISION"
        levelName:
          type: string
          description: Display label for UI tab
          example: "Division"
        presentCount:
          type: integer
          description: Present count for tab badge UI (e.g., 2)
          example: 2
        totalCount:
          type: integer
          description: Total team members count for tab badge UI (e.g., 20)
          example: 20

    HierarchyLevelsData:
      type: object
      required:
        - currentUserRole
        - levels
      properties:
        currentUserRole:
          type: string
          example: "NATIONAL_MANAGER"
        levels:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyLevelItem'

    HierarchyLevelsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HierarchyLevelsData'

    # --- ATTENDANCE SCHEMAS ---
    AttendanceSummaryStats:
      type: object
      required:
        - attendancePercentage
        - presentDays
        - lateDays
        - leaveDays
        - absentDays
      properties:
        attendancePercentage:
          type: number
          format: float
          description: Total attendance percentage for the month
          example: 75.0
        presentDays:
          type: integer
          example: 12
        lateDays:
          type: integer
          example: 2
        leaveDays:
          type: integer
          example: 1
        absentDays:
          type: integer
          example: 1

    DailyAttendanceStatus:
      type: object
      required:
        - date
        - status
      properties:
        date:
          type: string
          format: date
          description: Full date string (YYYY-MM-DD)
          example: "2026-01-01"
        status:
          type: string
          description: Attendance state for the day
          enum: [ PRESENT, LATE, LEAVE, ABSENT, HOLIDAY ]
          example: "PRESENT"
        statusId:
          type: integer
          description: Numeric code mapping (0=ABSENT, 1=PRESENT, 2=LATE, 3=LEAVE, 4=HOLIDAY)
          example: 1

    MonthlyAttendanceData:
      type: object
      required:
        - summary
        - calendar
      properties:
        summary:
          $ref: '#/components/schemas/AttendanceSummaryStats'
        calendar:
          type: array
          items:
            $ref: '#/components/schemas/DailyAttendanceStatus'

    MonthlyAttendanceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Monthly attendance report retrieved successfully."
            data:
              $ref: '#/components/schemas/MonthlyAttendanceData'

    # --- TODAY ATTENDANCE STATUS SCHEMAS ---
    LeaveInfo:
      type: object
      required:
        - fromDate
        - toDate
        - leaveType
        - status
      properties:
        fromDate:
          type: string
          format: date
          example: "2026-02-15"
        toDate:
          type: string
          format: date
          example: "2026-02-18"
        leaveType:
          type: string
          example: "Casual Leave"
        status:
          type: string
          description: APPROVED when the user is on leave, PENDING when the request is awaiting approval
          enum: [ APPROVED, PENDING ]
          example: "APPROVED"

    TodayAttendanceStatusData:
      type: object
      required:
        - serverTime
        - attendanceDeadline
        - status
      properties:
        serverTime:
          type: string
          format: date-time
          description: Server clock at response time, with UTC offset. The app uses it to correct device-clock drift.
          example: "2026-09-20T09:05:12+06:00"
        attendanceDeadline:
          type: string
          format: date-time
          description: Last moment for on-time attendance today, with UTC offset. Check-ins after this are late.
          example: "2026-09-20T09:30:00+06:00"
        loginTime:
          type: string
          format: date-time
          nullable: true
          description: >
            When the user marked attendance today, with UTC offset. Null until attendance is
            given (status ABSENT or LEAVE).
          example: "2026-10-01T10:30:00+06:00"
        status:
          type: string
          description: >
            Matched case-insensitively. PRESENT = attendance already marked, no popup;
            ABSENT = show the check-in popup (on-time or late depending on attendanceDeadline);
            LEAVE = show the On Leave popup when leave.status is APPROVED, otherwise Leave Pending
          enum: [ PRESENT, ABSENT, LEAVE ]
          example: "ABSENT"
        leave:
          nullable: true
          description: Present when status is LEAVE
          allOf:
            - $ref: '#/components/schemas/LeaveInfo'

    TodayAttendanceStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Today's attendance status retrieved successfully."
            data:
              $ref: '#/components/schemas/TodayAttendanceStatusData'

    # --- LATE REASON SCHEMAS ---
    LateReason:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Illness"

    LateReasonListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Late reason list retrieved successfully."
            data:
              type: array
              items:
                $ref: '#/components/schemas/LateReason'

    # --- LEAVE REASON SCHEMAS ---
    LeaveReason:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Casual Leave"

    LeaveReasonListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Leave reason list retrieved successfully."
            data:
              type: array
              items:
                $ref: '#/components/schemas/LeaveReason'

    # --- GEOFENCE SCHEMAS ---
    GeofenceConfigData:
      type: object
      required:
        - salespointId
        - checkInOption
        - defaultRadiusMeters
      properties:
        salespointId:
          type: integer
          description: Distributor id this rule applies to
          example: 7645
        checkInOption:
          type: integer
          description: >
            How the app treats a check-in when the device is outside the location's radius:
            1=Block (reject, do not submit), 2=Warning (ask the user to confirm, then submit),
            3=Bypass (submit without checking)
          enum: [ 1, 2, 3 ]
          example: 2
        defaultRadiusMeters:
          type: integer
          description: Allowed distance from the location's coordinates, used when a location has no radiusMeters
          example: 50

    GeofenceConfigResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Geofence configuration retrieved successfully."
            data:
              type: array
              items:
                $ref: '#/components/schemas/GeofenceConfigData'

    # --- TEAM ATTENDANCE SCHEMAS ---
    TeamAttendanceStats:
      type: object
      required:
        - total
        - present
        - late
        - leave
        - absent
      properties:
        total:
          type: integer
          example: 20
        present:
          type: integer
          example: 4
        late:
          type: integer
          example: 2
        leave:
          type: integer
          example: 2
        absent:
          type: integer
          example: 1

    ManagerAttendanceListItem:
      type: object
      required:
        - userId
        - fullName
        - designation
        - locationPath
        - status
      properties:
        userId:
          type: string
          example: "usr_101"
        fullName:
          type: string
          example: "Sarah Johnson"
        designation:
          type: string
          example: "Sales Manager"
        profilePictureUrl:
          type: string
          format: uri
          nullable: true
          example: "https://cdn.example.com/avatars/usr_101.jpg"
        locationPath:
          type: string
          description: Breadcrumb location hierarchy (e.g., Region / Area / Territory)
          example: "North / Metro / Zone A"
        status:
          type: string
          enum: [ PRESENT, LATE, LEAVE, ABSENT ]
          example: "PRESENT"
        checkInTime:
          type: string
          nullable: true
          description: Formatted check-in time if present or late
          example: "09:05 AM"

    TeamAttendanceSummaryData:
      type: object
      required:
        - levelKey
        - summary
        - managerList
      properties:
        levelKey:
          type: string
          example: "DIVISION"
        summary:
          $ref: '#/components/schemas/TeamAttendanceStats'
        managerList:
          type: array
          items:
            $ref: '#/components/schemas/ManagerAttendanceListItem'

    TeamAttendanceSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TeamAttendanceSummaryData'

    # --- AI SALES REPORT SCHEMAS ---
    AskOpenAiRequest:
      type: object
      required:
        - userID
        - role
        - userPrompt
      properties:
        userID:
          type: string
          example: "usr_7f3a92bc"
        role:
          type: string
          example: "NATIONAL_MANAGER"
        userPrompt:
          type: string
          example: "Show me last month's top 5 distributors by sales"

    AskOpenAiResponse:
      type: object
      description: >
        Standalone response envelope (does not use BaseApiResponse — matches the
        actual backend contract, which has no `success` field). `aiResponses` is a
        dynamic tabular result: each item is a row represented as a free-form
        column-name/value map, with no fixed schema.
      properties:
        data:
          type: object
          properties:
            aiResponses:
              type: array
              items:
                type: object
                additionalProperties: true
              example:
                - outletName: "Hazrot Ali"
                  totalSalesValue: 541766.55
                - outletName: "Swapna Khatun"
                  totalSalesValue: 339707.24
            usageRemaining:
              type: integer
              example: 7
            queryLogID:
              type: integer
              description: >
                Id of the log row created for this query. Pass it back as `QueryLogID`
                when calling /AIReportGenerator/AskOpenAIForSummary.
              example: 20
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          nullable: true
          example: "Data Fetched Successfully"

    AskOpenAiSummaryRequest:
      type: object
      required:
        - UserID
        - Role
        - UserPrompt
        - QueryLogID
        - Data
      properties:
        UserID:
          type: string
          example: "1768"
        Role:
          type: string
          example: "TSO"
        UserPrompt:
          type: string
          description: The prompt whose result is being summarised.
          example: "give me 10 top outlets by sales in 2025"
        QueryLogID:
          type: integer
          description: The `queryLogID` returned by /AIReportGenerator/AskOpenAI for this query.
          example: 34
        Data:
          type: array
          description: >
            The result rows, one object per row keyed by column name. Numeric cells are
            sent as JSON numbers, everything else as strings.
          items:
            type: object
            additionalProperties: true
          example:
            - outlet: "MOSARRAF HOSSAIN BABU"
              sales Date: "26 Jan 2026"
              total Sales: 484249.2
            - outlet: "Md A Salam"
              sales Date: "14 Feb 2026"
              total Sales: 249743.0

    AiSummary:
      type: object
      properties:
        summary:
          type: string
          description: A short prose reading of the result.
          example: "Top 10 outlets by sales are listed, but all records are dated Jan-Mar 2026, not 2025."
        highlights:
          type: array
          description: Notable data points drawn from the rows.
          items:
            type: string
          example:
            - "#1 MOSARRAF HOSSAIN BABU: BDT 4,84,249.20 on 26 Jan 2026"
            - "#2 Md A Salam: BDT 2,49,743.00; gap to #1 is BDT 2,34,506.20"
        actions:
          type: array
          description: Suggested next steps for the user's role.
          items:
            type: string
          example:
            - "As a TSO, visit MOSARRAF HOSSAIN BABU and Md A Salam to reinforce assortment."
        message:
          type: string
          nullable: true
          example: ""

    AskOpenAiSummaryResponse:
      type: object
      description: Standalone response envelope (no `success` field), as with the other AI endpoints.
      properties:
        data:
          type: object
          properties:
            aiSummary:
              $ref: '#/components/schemas/AiSummary'
            usageRemaining:
              type: integer
              example: 7
            summaryLogID:
              type: integer
              example: 3
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          nullable: true
          example: "Summary Data Fetched Successfully"

    QueryLogItem:
      type: object
      properties:
        queryLogID:
          type: integer
          example: 20
        userPrompt:
          type: string
          example: "give me last years 10 top outlets by sales"
        executedAt:
          type: string
          format: date-time
          example: "2026-09-20T15:47:10.19"

    QueryLogListResponse:
      type: object
      description: >
        Standalone response envelope (no `success` field), shared by
        /AIReportGenerator/GetAIFAQs and /AIReportGenerator/GetCurrentUserAllQueryLog —
        the backend returns the identical shape for both.
      properties:
        data:
          type: object
          properties:
            aiResponses:
              type: array
              items:
                $ref: '#/components/schemas/QueryLogItem'
            aiSummary:
              type: string
              nullable: true
              example: null
            usageRemaining:
              type: integer
              description: >
                Remaining AI requests for the day. Always 0 on the FAQ endpoint, which
                does not track quota — clients should read it from AskOpenAI or
                GetCurrentUserAllQueryLog only.
              example: 0
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          nullable: true
          example: "Data Fetched Successfully"

    # --- DISTRIBUTOR SCHEMAS ---
    Distributor:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          example: 101
        name:
          type: string
          nullable: true
          example: "ABC Distribution"
        latitude:
          type: string
          nullable: true
          example: "23.780636"
        longitude:
          type: string
          nullable: true
          example: "90.279541"
        code:
          type: string
          nullable: true
          example: "DIST-101"
        address:
          type: string
          nullable: true
          example: "123 Main Road, Dhaka"

    DistributorListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            message:
              example: "Distributors retrieved successfully."
            data:
              type: array
              items:
                $ref: '#/components/schemas/Distributor'

    # --- DISTRIBUTOR DETAIL SCHEMAS ---
    SkuRef:
      type: object
      required:
        - skuId
        - skuName
      properties:
        skuId:
          type: integer
          example: 4521
        skuCode:
          type: string
          nullable: true
          example: "SKU-4521"
        skuName:
          type: string
          example: "Classic Cola 500ml"

    DistributorGrowth:
      type: object
      required:
        - growthPercent
        - mtdAchievementPercent
        - ytdAchievementPercent
      properties:
        growthPercent:
          type: number
          description: Overall growth vs the previous period; negative means decline
